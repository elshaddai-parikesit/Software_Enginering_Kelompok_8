<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar Akun - MyKost.ID</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #FFFDF9; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 100%; max-width: 400px; border: 1px solid #eee; }
        input { width: 90%; padding: 14px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #ddd; font-family: inherit; }
        button { width: 100%; padding: 16px; background: #00A693; color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 1rem; }
    </style>
</head>
<body>

<div class="register-box">
    <h2 style="text-align: center; margin-top: 0; color: #333;">Daftar Akun Baru</h2>
    <p style="text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 30px;">Bergabung dengan Kelompok 8 MyKost.ID</p>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div style="color: red; font-size: 0.8rem; text-align: center; margin-bottom: 15px;">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/register" method="POST">
        <label style="font-size: 0.8rem; font-weight: 600;">Nama Lengkap</label>
        <input type="text" name="full_name" placeholder="Misal: Daron" required>
        
        <label style="font-size: 0.8rem; font-weight: 600;">Username</label>
        <input type="text" name="username" placeholder="Buat username unik" required>
        
        <label style="font-size: 0.8rem; font-weight: 600;">Password</label>
        <input type="password" name="password" placeholder="Buat password" required>
        
        <button type="submit">DAFTAR SEKARANG</button>
    </form>
    
    <p style="text-align: center; font-size: 0.85rem; margin-top: 20px;">
        Sudah punya akun? <a href="/#login" style="color: #00A693; font-weight: 600; text-decoration: none;">Login di sini</a>
    </p>
</div>

</body>
</html>
