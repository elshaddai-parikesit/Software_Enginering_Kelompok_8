<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Progress - MyKost</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; }
        .progress-container { max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-bottom: 30px; color: #333; }
        
        .step { display: flex; margin-bottom: 30px; position: relative; }
        .step:not(:last-child)::after {
            content: ''; position: absolute; left: 15px; top: 35px; width: 2px; height: 40px; background: #eee;
        }
        .step.done:not(:last-child)::after { background: #1DB954; }

        .circle { 
            width: 32px; height: 32px; border-radius: 50%; background: #eee; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 14px; font-weight: bold; color: white; margin-right: 20px; z-index: 2;
        }
        
        /* Status Colors */
        .done .circle { background: #1DB954; } /* Hijau */
        .active .circle { background: #FF8C42; box-shadow: 0 0 10px rgba(255,140,66,0.4); } /* Oranye */
        .waiting .circle { background: #ccc; } /* Abu-abu */

        .content h4 { margin: 0; font-size: 1rem; color: #333; }
        .content p { margin: 5px 0 0; font-size: 0.85rem; color: #777; line-height: 1.4; }
        
        .btn-home { 
            display: block; text-align: center; margin-top: 20px; padding: 12px; 
            background: #333; color: white; text-decoration: none; border-radius: 10px; font-weight: 600;
        }
    </style>
</head>
<body>

<div class="progress-container">
    <h2>Status <span style="color: #FF8C42;">Pesanan</span></h2>
    
    {% for step in steps %}
    <div class="step {{ step.status }}">
        <div class="circle">
            {% if step.status == 'done' %} ✓ {% else %} {{ loop.index }} {% endif %}
        </div>
        <div class="content">
            <h4>{{ step.title }}</h4>
            <p>{{ step.desc }}</p>
        </div>
    </div>
    {% endfor %}

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    <a href="/" class="btn-home">Kembali ke Beranda</a>
</div>

</body>
</html>
