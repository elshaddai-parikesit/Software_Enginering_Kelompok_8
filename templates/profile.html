<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pengguna - MyKost</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h2>MYKOST PROFILE</h2>
</header>

<div class="container">
    <div style="text-align: center; margin-bottom: 25px;">
        <div style="width: 100px; height: 100px; background: var(--accent-orange); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 40px; border: 4px solid white; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
            {{ user.username[0] | upper }}
        </div>
        <h1 style="margin-bottom: 0;">{{ user.full_name }}</h1>
        <p style="color: #888; margin-top: 5px;">Status: <span style="color: var(--accent-orange); font-weight: 600;">{{ user.role }}</span></p>
    </div>

    <div class="profile-info" style="background: #FFF9EF; padding: 20px; border-radius: 15px; border: 1px solid var(--soft-border); margin-bottom: 30px;">
        <p><strong>Username:</strong> {{ user.username }}</p>
        <p><strong>Jenis Kelamin:</strong> {{ user.gender }}</p>
        <p><strong>Alamat:</strong> {{ user.address }}</p>
    </div>

    <hr style="border: none; border-top: 1px solid var(--soft-border); margin-bottom: 25px;">

    <h3 style="text-align: left; color: var(--primary-brown); margin-bottom: 15px;">Edit Informasi Profil</h3>
    <form action="/update-profile" method="POST">
        <label>Nama Lengkap</label>
        <input type="text" name="full_name" value="{{ user.full_name }}" required>

        <label>Alamat Saat Ini</label>
        <input type="text" name="address" value="{{ user.address }}" required>

        <label>Jenis Kelamin</label>
        <select name="gender">
            <option value="Laki-laki" {% if user.gender == 'Laki-laki' %}selected{% endif %}>Laki-laki</option>
            <option value="Perempuan" {% if user.gender == 'Perempuan' %}selected{% endif %}>Perempuan</option>
        </select>

        <button type="submit">SIMPAN PERUBAHAN</button>
    </form>

    <div class="nav-links">
        <a href="/preferences">← Kembali Cari Kost</a>
    </div>
</div>

<div class="footer-text">
    &copy; 2026 Software Engineering - Kelompok 8
</div>

</body>
</html>
