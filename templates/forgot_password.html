<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - MyKost</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
    <h2>MYKOST SECURITY</h2>
</header>

<div class="container" style="max-width: 450px; margin-top: 50px;">
    <div style="text-align: center; margin-bottom: 20px;">
        <span style="font-size: 50px;">🔐</span>
    </div>
    <h1>Atur Ulang Password</h1>
    <p style="color: #666; font-size: 0.9em; margin-bottom: 25px;">Masukkan username Anda untuk memperbarui kata sandi.</p>

    <form action="/forgot-password" method="POST" onsubmit="return validateReset()">
        <label>Username</label>
        <input type="text" name="username" placeholder="Masukkan username akun Anda" required>

        <label>Password Baru</label>
        <input type="password" id="new_password" name="new_password" placeholder="Buat password baru" required>

        <label>Konfirmasi Password Baru</label>
        <input type="password" id="confirm_new_password" placeholder="Ketik ulang password baru" required>

        <button type="submit" style="margin-top: 15px; font-weight: 700;">PERBARUI PASSWORD</button>
        
        <button type="button" onclick="window.location.href='/'" 
                style="background: white; color: #888; border: 1px solid #ddd; margin-top: 10px;">
            BATAL & KEMBALI
        </button>
    </form>
</div>

<div class="footer-text">
    &copy; 2026 Software Engineering - Kelompok 8
</div>

<script>
    function validateReset() {
        var p1 = document.getElementById("new_password").value;
        var p2 = document.getElementById("confirm_new_password").value;
        if (p1 != p2) {
            alert("⚠️ Password baru tidak cocok! Silakan cek kembali.");
            return false;
        }
        return true;
    }
</script>

</body>
</html>
